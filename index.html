<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlanificadorAPP</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
     <header>
      <nav class="navbar bg-body-tertiary">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">
            <img
              src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT-3rAnq_dtKwXFE3q2w2vvgmRrsoIMUwZwDoK764zsRg&s=10"
              alt="Logo"
              width="30"
              height="24"
              class="d-inline-block align-text-top"
            />
            Planificador APP
          </a>
        </div>
      </nav>
    </header>

    <main>
      <!--Esquema principal-->
      <!--Inicio contenedores esquema-->
      <div class="container text-center">
        <!--Inicio contenedor 1 equema-->
        <div class="row">
          <!--Contenedor priorizadas-->
          <div class="col-4">
            <!--Contenedor collapse-->
            <div id="priorizadas-cont">
              <p>
                <button class="btn btn-primary" type="button" data-bs-toggle="collapse" data-bs-target="#collapseWidthExample" aria-expanded="false" aria-controls="collapseWidthExample">
                  Tareas Priorizadas
                </button>
              </p>
              <div style="min-height: 120px;">
                <div class="collapse collapse-horizontal" id="collapseWidthExample">
                  <div class="card card-body" style="width: 300px;">
                    <!--Listado tareas priorizadas-->
                    <ul class="list-group list-group-flush">
                      <li class="list-group-item">Hacer arroz</li>
                      <li class="list-group-item">Barrer</li>
                      <li class="list-group-item">Lavar ropa</li>
                      <li class="list-group-item">Trapear</li>
                      <li class="list-group-item">Dormir</li>
                    </ul>                    
                  </div>
                </div>
              </div>
            </div>
          </div> 


          <!--Contenedor agregar tarea-->
          <div class="col-8">
            <!--Contenerdor collapse-->
            <div id="agregar-cont">
              <p class="d-inline-flex gap-1">
                <button class="btn btn-primary" type="button" data-bs-toggle="collapse" data-bs-target="#collapseExample" aria-expanded="false" aria-controls="collapseExample">
                  Agregar tarea
                </button>
              </p>
              <div class="collapse" id="collapseExample">
                <div class="card card-body">
                    Campo para formulario <br>
                  Some placeholder content for the collapse component. This panel is hidden by default but revealed when the user activates the relevant trigger.
                </div>
              </div>
            </div>         
          </div>
         </div> 
       
          
        <!--Inicio contenedor 2 equema-->
        <div class="row">
          <!--Contenedor mostrar tareas-->
          <div class="col-12">
            <h5 class="card-title">Lista de tareas</h5>
            <!--Botones-->
            <div id="btn-contenedor">
              <button type="button" class="btn btn-outline-primary">Todas las tareas</button>
              <button type="button" class="btn btn-outline-secondary">Tareas priorizadas</button>
              <button type="button" class="btn btn-outline-success">Tareas pendientes</button>
              <button type="button" class="btn btn-outline-danger">Tareas vencidas</button>
              <button type="button" class="btn btn-outline-warning">Tareas completadas</button>
              <button type="button" class="btn btn-outline-info">Tareas proximas a vencer</button>
              <button type="button" class="btn btn-outline-dark">Dark</button>
            </div>
            <!--Carrusel tareas-->
            <div id="carrusel-contenedor">Carrusel tareas</div>
          </div>
        </div>
        
      <!--Cierre contenedor general container text-center-->  
      </div>
    </main>
    
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>
  </body>
</html>
